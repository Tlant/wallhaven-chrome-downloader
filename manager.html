<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallhaven 清单与下载任务</title><link rel="stylesheet" href="manager.css"></head><body>
<header><h1>Wallhaven 清单与下载任务</h1><p>先选择图片，再建立任务。任何导入和解析操作都不会自动下载。</p></header>
<main>
<section class="panel"><div class="heading"><h2>1 · 当前网页</h2><span id="source"></span></div><div class="toolbar"><button id="scan">读取当前网页图片</button><button id="select-all">全选当前列表</button><button id="select-none">取消当前列表选择</button></div><p id="scope"></p><div id="gallery" class="gallery"></div></section>
<section class="panel"><div class="heading"><h2>2 · 已选清单</h2><strong id="selected-count">0 张</strong></div><div id="selected-list" class="selected-list"></div><div class="toolbar"><button id="resolve">解析已选图片的真实 URL</button><button id="copy">复制已解析 URL</button><button id="txt">保存 URL 文本（1 个文件）</button><button id="clear">清空已选清单</button></div><p id="resolve-status"></p><textarea id="urls" readonly placeholder="解析后，每行显示一张原图的真实 URL"></textarea><div class="toolbar"><button id="create-files" class="primary">建立逐张下载任务</button><button id="create-zip" class="primary">建立单个 ZIP 任务</button></div></section>
<section class="panel"><div class="heading"><h2>3 · 任务详情</h2><span>重启 Chrome 后任务保持暂停</span></div><div id="tasks"></div></section>
<section class="panel"><h2>解析方式</h2><label><input id="use-key" type="checkbox"> 优先使用 API Key</label><p>不勾选时，使用当前 Wallhaven 标签页的登录状态读取图片详情，浏览器会自动附带该网站的 Cookie。勾选后若 Key 未填写或失效，会自动回退到网站登录状态。</p><details><summary>填写 API Key（可选）</summary><p>登录 Wallhaven 后，在<a href="https://wallhaven.cc/settings/account" target="_blank" rel="noopener">账户设置</a>获取 API Key。Key 只保存在本机扩展存储，不会写入 URL 文本。</p><input id="key" type="password" autocomplete="off"><button id="save-key">保存解析设置</button></details></section>
</main><dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="toolbar"><button id="confirm-no">返回</button><button id="confirm-yes" class="primary">确认</button></div></dialog><div id="toast" role="status"></div><script type="module" src="manager.js"></script></body></html>
